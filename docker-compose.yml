# OpenHarvest — Phase 0 / Phase 1 stack.
# Just postgres + api. Future phases will add: redis (Phase 3 SignalR backplane),
# minio (Phase 2 photo storage), traefik (Phase 0+ ingress), worker (Phase 4).
#
# Quick start:
#   docker compose up --build
#   open http://localhost:5000
#
# Resets:
#   docker compose down -v   # nukes the postgres volume too

services:
  postgres:
    image: postgres:16-alpine
    container_name: openharvest-postgres
    environment:
      POSTGRES_DB: openharvest
      POSTGRES_USER: openharvest
      POSTGRES_PASSWORD: openharvest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openharvest"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/OpenHarvest.API/Dockerfile
    container_name: openharvest-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=openharvest;Username=openharvest;Password=openharvest
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
