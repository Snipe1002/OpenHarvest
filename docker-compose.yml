# OpenHarvest — Phase 3 stack: postgres + minio + redis + api.
# Future phases will add: traefik (Phase 0+ ingress), worker (Phase 4 advisor / thumbnail jobs).
#
# Quick start:
#   docker compose up --build
#   open http://localhost:5000
#
# Optional: open http://localhost:9001 for the MinIO console (login openharvest/openharvest)
#
# Resets:
#   docker compose down -v   # nukes the postgres + minio volumes too

services:
  postgres:
    image: postgres:16-alpine
    container_name: openharvest-postgres
    environment:
      POSTGRES_DB: openharvest
      POSTGRES_USER: openharvest
      POSTGRES_PASSWORD: openharvest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openharvest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openharvest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: openharvest-minio
    environment:
      MINIO_ROOT_USER: openharvest
      MINIO_ROOT_PASSWORD: openharvest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/OpenHarvest.API/Dockerfile
    container_name: openharvest-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=openharvest;Username=openharvest;Password=openharvest
      - ConnectionStrings__Redis=redis:6379
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=openharvest
      - Minio__SecretKey=openharvest
      - Minio__Bucket=photos
      - Minio__UseSsl=false
      - Minio__PresignedUrlBase=http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
