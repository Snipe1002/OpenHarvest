# OpenHarvest — Phase 4 stack: postgres + redis + minio + api.
# Future phases will add: traefik (Phase 0+ ingress), worker (Phase 4.x advisor jobs / thumbnails).
#
# Quick start:
#   docker compose up --build
#   open http://localhost:5000
#
# Optional: open http://localhost:9001 for the MinIO console (login openharvest/openharvest)
#
# AI advisor:
#   Set CLAUDE_API_KEY in your shell/.env to enable the master gardener.
#   Without it the API still runs; the Ask button just returns a "not configured" message.
#
# Resets:
#   docker compose down -v   # nukes the postgres + minio volumes too

services:
  postgres:
    image: postgres:16-alpine
    container_name: openharvest-postgres
    environment:
      POSTGRES_DB: openharvest
      POSTGRES_USER: openharvest
      POSTGRES_PASSWORD: openharvest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openharvest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openharvest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: openharvest-minio
    environment:
      MINIO_ROOT_USER: openharvest
      MINIO_ROOT_PASSWORD: openharvest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/OpenHarvest.API/Dockerfile
    container_name: openharvest-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=openharvest;Username=openharvest;Password=openharvest
      - ConnectionStrings__Redis=redis:6379
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=openharvest
      - Minio__SecretKey=openharvest
      - Minio__Bucket=photos
      - Minio__UseSsl=false
      - Minio__PresignedUrlBase=http://localhost:9000
      - AI__Claude__ApiKey=${CLAUDE_API_KEY:-}
      # Walk-mode v1 — operator-configured vision-inference endpoint following the
      # contract documented in README.md "Walk Mode → Vision endpoint contract".
      # Leave unset to disable classification (captures still upload, the staging
      # panel just marks them ClassificationFailed; manual promote still works).
      - OpenHarvest__Vision__Url=${OPENHARVEST_VISION_URL:-}
      - OpenHarvest__Vision__AuthToken=${OPENHARVEST_VISION_AUTHTOKEN:-}
      # Photo storage directory inside the container. Mount a volume here to
      # persist photos across container restarts.
      - OpenHarvest__WalkPhoto__Directory=${OPENHARVEST_PHOTO_DIR:-/app/data/photos}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/OpenHarvest.Worker/Dockerfile
    container_name: openharvest-worker
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Development
      - Worker__ApiBaseUrl=http://api:5000
      - Worker__NudgeScanIntervalSeconds=300
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
