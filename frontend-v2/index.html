<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OpenHarvest v2</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #1a1a1a; color: #ddd; font-family: system-ui, sans-serif; }
      /* Touch handling: take over ALL gestures on the canvas so iOS Safari
         and Android Chrome don't intercept horizontal swipes for back/forward
         navigation. `touch-action: none` tells the browser "I'll handle every
         pointer gesture myself" — drei's CameraControls then receives every
         event cleanly. `overscroll-behavior: none` on html/body prevents the
         pull-to-refresh / rubber-band at the edges. */
      html, body { overscroll-behavior: none; overscroll-behavior-x: none; }
      canvas { touch-action: none; }
      /* iOS Safari long-press triggers a text selection callout (Copy /
         Find Selection / Look Up) on label text inside HUD pills and
         buttons, often extending the selection across multiple pills —
         see the bug report screenshot from 2026-04-28. `user-select: none`
         on individual chips is ignored by iOS for button labels and
         non-interactive spans; the working fix is a global default with
         the WebKit prefixes, then opt back in for actual editable fields. */
      body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input, textarea, [contenteditable="true"] {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fallback shim for Node-style `process` references in third-party
      // bundles (Pascal's viewer reads process.env.NODE_ENV directly).
      // Vite's `define` handles the literal `process.env.NODE_ENV` token at
      // build time, but this catches any other process.* access at runtime.
      if (typeof window.process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
