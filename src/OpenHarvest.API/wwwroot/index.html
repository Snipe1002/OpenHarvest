<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- All relative URLs resolve against the document URL, so the app works whether it's
       served at the site root (/) or under a sub-path (e.g. /openharvest/). Keep this as
       the very first element in <head>. -->
  <base href="./" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>OpenHarvest</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0e0e10" />
  <style>
    :root {
      --bg: #0e0e10;
      --panel: #1c1c20;
      --panel-hover: #2a2a30;
      --border: rgba(255,255,255,0.12);
      --text: #eee;
      --text-dim: #aaa;
      --accent: #4ade80;
      --danger: #f87171;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; display: block; }

    #status {
      position: fixed; top: env(safe-area-inset-top, 8px); left: 8px;
      background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 6px;
      font-size: 12px; pointer-events: none; max-width: 80vw;
      transition: opacity 0.4s;
    }
    #status.hide { opacity: 0; }

    #buttons {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    #buttons button {
      background: var(--panel); color: var(--text); border: 0;
      padding: 18px 4px; font-size: 16px; font-weight: 500;
      cursor: pointer; touch-action: manipulation;
    }
    #buttons button:active, #buttons button.active { background: var(--panel-hover); color: var(--accent); }
    #buttons button:disabled { color: #666; cursor: default; }

    /* autocomplete + rename modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .modal {
      background: var(--panel);
      border-top: 1px solid var(--border);
      width: 100%; max-width: 600px;
      padding: 16px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .modal h2 { margin: 0 0 12px 0; font-size: 16px; font-weight: 500; color: var(--text-dim); }
    .modal input {
      width: 100%; padding: 12px; font-size: 16px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; outline: none;
    }
    .modal input:focus { border-color: var(--accent); }
    .suggestions {
      max-height: 40vh; overflow-y: auto; margin-top: 8px;
    }
    .suggestion {
      padding: 12px; cursor: pointer; border-radius: 6px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .suggestion:hover, .suggestion.highlight { background: var(--panel-hover); }
    .suggestion .name { font-size: 16px; }
    .suggestion .scientific { font-size: 12px; color: var(--text-dim); font-style: italic; }
    .modal-actions {
      display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end;
    }
    .modal-actions button {
      padding: 10px 16px; font-size: 14px;
      background: transparent; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer;
    }
    .modal-actions button.primary {
      background: var(--accent); color: #06210d; border-color: var(--accent); font-weight: 600;
    }
    .modal-actions button.danger {
      background: var(--danger); color: #2a0a0a; border-color: var(--danger); font-weight: 600;
    }

    /* floating advisor buttons */
    #askButton, #calendarButton, #settingsButton {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 8px 14px; font-size: 14px; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #askButton { right: 8px; }
    #calendarButton { right: 92px; }
    /* Phase 5.1: gear sits left of Calendar so the row reads (left → right):
       ⚙ Settings · 📅 Calendar · 🌱 Ask. Width is roughly 80px per pill. */
    #settingsButton { right: 176px; padding: 8px 12px; }
    #askButton:active, #askButton.active,
    #calendarButton:active, #calendarButton.active,
    #settingsButton:active, #settingsButton.active { background: var(--panel-hover); color: var(--accent); }
    #askButton.unconfigured, #calendarButton.unconfigured { opacity: 0.5; }

    /* Phase 5.1: compass overlay. Sits below the floating buttons so it doesn't
       overlap the Ask/Calendar/Settings row (~48px tall). The whole element rotates
       so N stays aligned with scene-north as the camera spins. */
    #compass {
      position: fixed;
      top: calc(env(safe-area-inset-top, 8px) + 52px);
      right: 12px;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(20, 20, 24, 0.78);
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      pointer-events: none;
      z-index: 25;
      will-change: transform;
    }
    #compass .needle {
      position: absolute; left: 50%; top: 8px;
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 24px solid var(--accent);
      transform: translateX(-50%);
    }
    #compass .needle.tail {
      top: auto; bottom: 8px;
      border-bottom: 0;
      border-top: 24px solid var(--text-dim);
    }
    #compass span {
      position: absolute;
      font-size: 11px; font-weight: 700;
      color: var(--text);
      width: 16px; text-align: center;
    }
    #compass .n { top: -2px; left: 27px; color: var(--accent); }
    #compass .s { bottom: -2px; left: 27px; }
    #compass .e { right: -2px; top: 27px; }
    #compass .w { left: -2px; top: 27px; }

    /* Phase 5.1: sun phase pill, anchored top-left next to the status text. */
    #sunPhase {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      left: 8px;
      transform: translateY(28px);
      background: rgba(0,0,0,0.55);
      padding: 4px 10px; border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      max-width: 60vw;
      white-space: nowrap;
    }
    #sunPhase.hidden { display: none; }

    /* Phase 5.1: settings modal layout — stacked sections, decimal inputs,
       a "use my location" helper button, and a small lat/lng-missing warning. */
    .settings-section { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .settings-section label {
      font-size: 11px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .settings-help {
      margin-top: 8px;
      padding: 8px 10px; border-radius: 6px;
      background: rgba(248, 113, 113, 0.10);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--danger); font-size: 12px;
    }
    .settings-help.hidden { display: none; }
    .settings-locate {
      padding: 8px 12px; font-size: 13px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    }
    .settings-locate:hover { background: var(--panel-hover); }
    .settings-locate:disabled { opacity: 0.5; cursor: default; }

    /* nudge banners */
    #nudges {
      position: fixed;
      top: calc(env(safe-area-inset-top, 8px) + 48px);
      right: 8px; left: 8px;
      max-width: 480px; margin-left: auto;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: none;
      z-index: 30;
    }
    .nudge {
      pointer-events: auto;
      display: flex; gap: 10px; align-items: center;
      padding: 10px 12px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      animation: nudge-in 0.2s ease;
    }
    .nudge.fade { opacity: 0; transition: opacity 0.4s ease; }
    .nudge .x { color: var(--text-dim); margin-left: auto; padding-left: 8px; }
    @keyframes nudge-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    /* calendar list (inside .modal) */
    .calendar-list { max-height: 50vh; overflow-y: auto; margin-top: 12px; }
    .calendar-month { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 4px 0; }
    .calendar-row {
      display: grid; grid-template-columns: 56px 1fr; gap: 8px;
      padding: 8px; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .calendar-row .date { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .calendar-row .crop { font-weight: 500; }
    .calendar-row .kind { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .calendar-row .note { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

    .ai-answer {
      margin-top: 12px; padding: 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; line-height: 1.5; white-space: pre-wrap;
      max-height: 50vh; overflow-y: auto;
    }
    .ai-meta { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
    .ai-spinner {
      margin-top: 12px; padding: 12px; color: var(--text-dim);
      border: 1px dashed var(--border); border-radius: 6px;
      font-size: 14px; text-align: center;
    }

    /* photo grid (inside .modal) */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px;
      margin-top: 12px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .photo-tile {
      position: relative;
      aspect-ratio: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
    }
    .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-tile .meta {
      position: absolute; left: 0; bottom: 0; right: 0;
      padding: 4px 6px; font-size: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }
    .photo-tile .delete {
      position: absolute; top: 4px; right: 4px;
      width: 24px; height: 24px; border-radius: 12px;
      background: rgba(0,0,0,0.7);
      color: var(--danger); font-size: 14px; line-height: 24px; text-align: center;
      cursor: pointer;
    }
    .photo-empty {
      padding: 24px; text-align: center; color: var(--text-dim); font-size: 14px;
      border: 1px dashed var(--border); border-radius: 6px; margin-top: 12px;
    }

    /* radial menu */
    #radial {
      position: fixed; pointer-events: none; z-index: 50;
      width: 200px; height: 200px;
      transform: translate(-50%, -50%);
    }
    #radial.open { pointer-events: auto; }
    #radial .item {
      position: absolute; left: 50%; top: 50%;
      width: 64px; height: 64px;
      margin-left: -32px; margin-top: -32px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease;
      transform: translate(0, 0);
      opacity: 0;
    }
    #radial.open .item { opacity: 1; }
    /* 5-point pentagon arrangement: photo (top), rename (upper right), move (lower right),
       resize (lower left), delete (upper left). Uses 72° spacing on a 78px radius so the
       icons don't crowd. */
    #radial.open .item:nth-child(1) { transform: translate(0, -78px); }              /* 90°  = photo */
    #radial.open .item:nth-child(2) { transform: translate(74px, -24px); }           /* 18°  = rename */
    #radial.open .item:nth-child(3) { transform: translate(46px, 63px); }            /* -54° = move */
    #radial.open .item:nth-child(4) { transform: translate(-46px, 63px); }           /* -126°= resize */
    #radial.open .item:nth-child(5) { transform: translate(-74px, -24px); }          /* 162° = delete */
    #radial .item:active { background: var(--panel-hover); }
    #radial .item.danger { color: var(--danger); }
    #radial .item.disabled { opacity: 0.35 !important; cursor: not-allowed; }

    /* persistent edit panel — Phase 5.0 selection model.
       Outline highlight is rendered Babylon-side via OutlineRenderer; this surface is the
       inspector for the currently selected entity. Docks right on desktop, slides up from
       the bottom on mobile. */
    #editPanel {
      position: fixed;
      right: 0;
      top: 0;
      width: 320px;
      height: 100%;
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #editPanel.open { transform: translateX(0); }
    @media (max-width: 768px) {
      #editPanel {
        right: 0; left: 0;
        bottom: 0; top: auto;
        width: auto; height: 60vh;
        border-left: 0;
        border-top: 1px solid var(--border);
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        transform: translateY(100%);
      }
      #editPanel.open { transform: translateY(0); }
    }

    #editPanel .ep-header {
      display: flex; align-items: center; gap: 8px;
      font-size: 16px; font-weight: 500;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    #editPanel .ep-close {
      margin-left: auto; cursor: pointer; color: var(--text-dim);
      width: 28px; height: 28px; line-height: 28px; text-align: center;
      border-radius: 14px;
    }
    #editPanel .ep-close:hover { background: var(--panel-hover); color: var(--text); }

    #editPanel .ep-section {
      display: flex; flex-direction: column; gap: 4px;
    }
    #editPanel .ep-section label {
      font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em;
    }
    #editPanel .ep-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
    }
    #editPanel .ep-row.row-2 { grid-template-columns: 1fr 1fr; }
    #editPanel input[type="number"], #editPanel input[type="text"] {
      width: 100%; padding: 8px; font-size: 14px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; outline: none;
    }
    #editPanel input:focus { border-color: var(--accent); }
    #editPanel .ep-actions {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px;
    }
    #editPanel .ep-actions button {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 4px; font-size: 18px; cursor: pointer;
    }
    #editPanel .ep-actions button:hover { background: var(--panel-hover); color: var(--accent); }
    #editPanel .ep-actions button.danger:hover { color: var(--danger); }
    #editPanel .ep-actions button:disabled { opacity: 0.35; cursor: not-allowed; }
    #editPanel .ep-empty {
      color: var(--text-dim); text-align: center; padding: 24px 0;
      font-size: 13px;
    }
    .tags-stub { color: var(--text-dim); font-size: 12px; padding: 6px; border: 1px dashed var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="status">loading...</div>
  <div id="sunPhase" class="hidden"></div>
  <button id="askButton" title="Ask the master gardener">🌱 Ask</button>
  <button id="calendarButton" title="Generate a planting calendar">📅 Calendar</button>
  <button id="settingsButton" title="Garden settings (location)">⚙</button>
  <div id="compass" aria-hidden="true">
    <div class="needle"></div>
    <div class="needle tail"></div>
    <span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span>
  </div>
  <div id="nudges"></div>
  <div id="buttons">
    <button data-mode="bed">Bed</button>
    <button data-mode="plant">Plant</button>
    <button disabled title="coming soon">Structure</button>
    <button disabled title="coming soon">Label</button>
  </div>
  <div id="radial">
    <div class="item" data-action="photo">Photo</div>
    <div class="item" data-action="rename">Rename</div>
    <div class="item" data-action="move">Move</div>
    <div class="item" data-action="resize">Resize</div>
    <div class="item danger" data-action="delete">Delete</div>
  </div>
  <!-- Phase 5.0: persistent edit panel. The .ep-content surface is re-rendered each time
       selection changes — simpler than fine-grained DOM updates. -->
  <div id="editPanel">
    <div class="ep-content"><div class="ep-empty">Tap a bed or plant to edit</div></div>
  </div>
  <input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none" />

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <!-- Phase 5.1: SunCalc is vendored locally (lib/suncalc.js) — no CDN, MIT-licensed. -->
  <script src="lib/suncalc.js"></script>
  <script src="app.js"></script>
</body>
</html>
