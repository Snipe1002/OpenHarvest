<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- All relative URLs resolve against the document URL, so the app works whether it's
       served at the site root (/) or under a sub-path (e.g. /openharvest/). Keep this as
       the very first element in <head>. -->
  <base href="./" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>OpenHarvest</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0e0e10" />
  <style>
    :root {
      --bg: #0e0e10;
      --panel: #1c1c20;
      --panel-hover: #2a2a30;
      --border: rgba(255,255,255,0.12);
      --text: #eee;
      --text-dim: #aaa;
      --accent: #4ade80;
      --danger: #f87171;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Phase 5.2.2 (B3) — kill iOS Safari long-press text selection + the gray callout overlay
       that pops on long-press of an emoji or icon. Apply broadly to interactive surfaces; we
       opt inputs back IN below so users can still select/copy text inside fields. */
    html, body, #renderCanvas, #toolbar, #buttons, #radial,
    .modal-backdrop, .chip, #askButton, #calendarButton, #settingsButton,
    .prefab-tile, .tags-chip, .tags-suggest-chip, .nudge {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    input, textarea, .ai-answer, .modal h2, .suggestion {
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default;
    }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; display: block; }

    #status {
      position: fixed; top: env(safe-area-inset-top, 8px); left: 8px;
      background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 6px;
      font-size: 12px; pointer-events: none; max-width: 80vw;
      transition: opacity 0.4s;
    }
    #status.hide { opacity: 0; }

    #buttons {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    #buttons button {
      background: var(--panel); color: var(--text); border: 0;
      padding: 18px 4px; font-size: 16px; font-weight: 500;
      cursor: pointer; touch-action: manipulation;
    }
    #buttons button:active, #buttons button.active { background: var(--panel-hover); color: var(--accent); }
    #buttons button:disabled { color: #666; cursor: default; }

    /* autocomplete + rename modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .modal {
      background: var(--panel);
      border-top: 1px solid var(--border);
      width: 100%; max-width: 600px;
      padding: 16px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .modal h2 { margin: 0 0 12px 0; font-size: 16px; font-weight: 500; color: var(--text-dim); }
    .modal input {
      width: 100%; padding: 12px; font-size: 16px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; outline: none;
    }
    .modal input:focus { border-color: var(--accent); }
    .suggestions {
      max-height: 40vh; overflow-y: auto; margin-top: 8px;
    }
    .suggestion {
      padding: 12px; cursor: pointer; border-radius: 6px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .suggestion:hover, .suggestion.highlight { background: var(--panel-hover); }
    .suggestion .name { font-size: 16px; }
    .suggestion .scientific { font-size: 12px; color: var(--text-dim); font-style: italic; }
    .modal-actions {
      display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end;
    }
    .modal-actions button {
      padding: 10px 16px; font-size: 14px;
      background: transparent; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer;
    }
    .modal-actions button.primary {
      background: var(--accent); color: #06210d; border-color: var(--accent); font-weight: 600;
    }
    .modal-actions button.danger {
      background: var(--danger); color: #2a0a0a; border-color: var(--danger); font-weight: 600;
    }

    /* floating advisor buttons */
    #askButton, #calendarButton, #settingsButton {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 8px 14px; font-size: 14px; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #askButton { right: 8px; }
    #calendarButton { right: 92px; }
    /* Phase 5.1: gear sits left of Calendar so the row reads (left → right):
       ⚙ Settings · 📅 Calendar · 🌱 Ask. Width is roughly 80px per pill. */
    #settingsButton { right: 176px; padding: 8px 12px; }
    #askButton:active, #askButton.active,
    #calendarButton:active, #calendarButton.active,
    #settingsButton:active, #settingsButton.active { background: var(--panel-hover); color: var(--accent); }
    #askButton.unconfigured, #calendarButton.unconfigured { opacity: 0.5; }

    /* Phase 5.1: compass overlay. Sits below the floating buttons so it doesn't
       overlap the Ask/Calendar/Settings row (~48px tall). The whole element rotates
       so N stays aligned with scene-north as the camera spins. */
    #compass {
      position: fixed;
      top: calc(env(safe-area-inset-top, 8px) + 52px);
      right: 12px;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(20, 20, 24, 0.78);
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      pointer-events: none;
      z-index: 25;
      will-change: transform;
    }
    #compass .needle {
      position: absolute; left: 50%; top: 8px;
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 24px solid var(--accent);
      transform: translateX(-50%);
    }
    #compass .needle.tail {
      top: auto; bottom: 8px;
      border-bottom: 0;
      border-top: 24px solid var(--text-dim);
    }
    #compass span {
      position: absolute;
      font-size: 11px; font-weight: 700;
      color: var(--text);
      width: 16px; text-align: center;
    }
    #compass .n { top: -2px; left: 27px; color: var(--accent); }
    #compass .s { bottom: -2px; left: 27px; }
    #compass .e { right: -2px; top: 27px; }
    #compass .w { left: -2px; top: 27px; }

    /* Phase 5.1: sun phase pill, anchored top-left next to the status text. */
    #sunPhase {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      left: 8px;
      transform: translateY(28px);
      background: rgba(0,0,0,0.55);
      padding: 4px 10px; border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      max-width: 60vw;
      white-space: nowrap;
    }
    #sunPhase.hidden { display: none; }

    /* Phase 5.1: settings modal layout — stacked sections, decimal inputs,
       a "use my location" helper button, and a small lat/lng-missing warning. */
    .settings-section { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .settings-section label {
      font-size: 11px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .settings-help {
      margin-top: 8px;
      padding: 8px 10px; border-radius: 6px;
      background: rgba(248, 113, 113, 0.10);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--danger); font-size: 12px;
    }
    .settings-help.hidden { display: none; }
    .settings-locate {
      padding: 8px 12px; font-size: 13px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    }
    .settings-locate:hover { background: var(--panel-hover); }
    .settings-locate:disabled { opacity: 0.5; cursor: default; }

    /* nudge banners */
    #nudges {
      position: fixed;
      top: calc(env(safe-area-inset-top, 8px) + 48px);
      right: 8px; left: 8px;
      max-width: 480px; margin-left: auto;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: none;
      z-index: 30;
    }
    .nudge {
      pointer-events: auto;
      display: flex; gap: 10px; align-items: center;
      padding: 10px 12px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      animation: nudge-in 0.2s ease;
    }
    .nudge.fade { opacity: 0; transition: opacity 0.4s ease; }
    .nudge .x { color: var(--text-dim); margin-left: auto; padding-left: 8px; }
    @keyframes nudge-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    /* calendar list (inside .modal) */
    .calendar-list { max-height: 50vh; overflow-y: auto; margin-top: 12px; }
    .calendar-month { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 4px 0; }
    .calendar-row {
      display: grid; grid-template-columns: 56px 1fr; gap: 8px;
      padding: 8px; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .calendar-row .date { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .calendar-row .crop { font-weight: 500; }
    .calendar-row .kind { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .calendar-row .note { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

    .ai-answer {
      margin-top: 12px; padding: 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; line-height: 1.5; white-space: pre-wrap;
      max-height: 50vh; overflow-y: auto;
    }
    .ai-meta { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
    .ai-spinner {
      margin-top: 12px; padding: 12px; color: var(--text-dim);
      border: 1px dashed var(--border); border-radius: 6px;
      font-size: 14px; text-align: center;
    }

    /* photo grid (inside .modal) */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px;
      margin-top: 12px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .photo-tile {
      position: relative;
      aspect-ratio: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
    }
    .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-tile .meta {
      position: absolute; left: 0; bottom: 0; right: 0;
      padding: 4px 6px; font-size: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }
    .photo-tile .delete {
      position: absolute; top: 4px; right: 4px;
      width: 24px; height: 24px; border-radius: 12px;
      background: rgba(0,0,0,0.7);
      color: var(--danger); font-size: 14px; line-height: 24px; text-align: center;
      cursor: pointer;
    }
    .photo-empty {
      padding: 24px; text-align: center; color: var(--text-dim); font-size: 14px;
      border: 1px dashed var(--border); border-radius: 6px; margin-top: 12px;
    }

    /* radial menu */
    #radial {
      position: fixed; pointer-events: none; z-index: 50;
      width: 200px; height: 200px;
      transform: translate(-50%, -50%);
    }
    #radial.open { pointer-events: auto; }
    #radial .item {
      position: absolute; left: 50%; top: 50%;
      width: 64px; height: 64px;
      margin-left: -32px; margin-top: -32px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease;
      transform: translate(0, 0);
      opacity: 0;
    }
    #radial.open .item { opacity: 1; }
    /* 5-point pentagon arrangement: photo (top), rename (upper right), move (lower right),
       resize (lower left), delete (upper left). Uses 72° spacing on a 78px radius so the
       icons don't crowd. */
    #radial.open .item:nth-child(1) { transform: translate(0, -78px); }              /* 90°  = photo */
    #radial.open .item:nth-child(2) { transform: translate(74px, -24px); }           /* 18°  = rename */
    #radial.open .item:nth-child(3) { transform: translate(46px, 63px); }            /* -54° = move */
    #radial.open .item:nth-child(4) { transform: translate(-46px, 63px); }           /* -126°= resize */
    #radial.open .item:nth-child(5) { transform: translate(-74px, -24px); }          /* 162° = delete */
    #radial .item:active { background: var(--panel-hover); }
    #radial .item.danger { color: var(--danger); }
    #radial .item.disabled { opacity: 0.35 !important; cursor: not-allowed; }

    /* Phase 5.2.1: slim floating toolbar — replaces the Phase 5.0 #editPanel. Sits as a
       fixed bar above the existing 5-button bottom bar so the scene stays visible behind
       it. Semi-transparent + blurred so we know what we're editing without losing context. */
    #toolbar {
      position: fixed;
      left: 8px; right: 8px;
      bottom: calc(64px + env(safe-area-inset-bottom, 0));
      height: 56px;
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px;
      background: rgba(20, 20, 24, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      /* Phase 5.2.2 (B4) — horizontal scroll for narrow phones. We have 9 action icons + name
         + position chip + close button now; on a 360px viewport they overflow. Letting the bar
         scroll horizontally keeps every control reachable without shrinking touch targets. */
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      z-index: 40;
    }
    #toolbar::-webkit-scrollbar { height: 2px; }
    #toolbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #toolbar.hidden { display: none; }
    #toolbar .tb-icon { font-size: 22px; line-height: 1; flex-shrink: 0; }
    #toolbar .tb-name {
      font-weight: 500; max-width: 110px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: pointer; padding: 6px 4px; border-radius: 6px;
      flex-shrink: 0;
    }
    #toolbar .tb-name:hover { background: var(--panel-hover); }
    #toolbar .tb-pos {
      color: var(--text-dim); font-variant-numeric: tabular-nums;
      cursor: pointer; padding: 6px 8px; border-radius: 6px;
      font-size: 12px; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #toolbar .tb-pos:hover { background: var(--panel-hover); color: var(--text); }
    #toolbar .tb-actions {
      display: flex; gap: 2px; margin-left: auto; flex-shrink: 0;
    }
    /* Phase 5.2.2 (B4) — every action button locks its width so the row scrolls intact rather
       than squashing icons into mush when the parent is narrower than the natural width. */
    #toolbar .tb-actions button {
      width: 44px; height: 44px;
      border: 0; background: transparent; color: var(--text);
      font-size: 20px; cursor: pointer; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    #toolbar .tb-actions button:hover { background: var(--panel-hover); }
    #toolbar .tb-actions button:disabled { opacity: 0.4; cursor: default; }
    #toolbar .tb-actions button.danger:hover { color: var(--danger); }
    #toolbar .tb-close {
      cursor: pointer; padding: 8px 10px; color: var(--text-dim);
      border-radius: 6px; font-size: 22px; line-height: 1;
      flex-shrink: 0;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    #toolbar .tb-close:hover { background: var(--panel-hover); color: var(--text); }

    /* Phase 5.2.1: floating chip — used for the units + snap controls in the top-right
       button row. Pill-shaped, matches the existing askButton/calendarButton styling so the
       chrome reads as a single "settings" cluster. */
    .chip {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 8px 12px; font-size: 13px; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      font-variant-numeric: tabular-nums;
    }
    .chip:active, .chip.active { background: var(--panel-hover); color: var(--accent); }
    /* Slot units + snap chips left of the existing settings button. The existing layout is
       ⚙ Settings (right:176, ~40px wide) · 📅 Calendar (right:92) · 🌱 Ask (right:8). The new
       chips sit further-left so the visual order reads (left→right): Snap · ft · ⚙ · 📅 · 🌱.
       Snap pill is the widest ("Snap: 1 ft"), so it gets a ~120px slot. */
    #unitChip { right: 230px; min-width: 44px; text-align: center; }
    #snapChip { right: 290px; min-width: 96px; text-align: center; }

    /* Phase 5.2: prefab picker. Tile grid with category headers — feels native to a touch
       device with thumb-sized targets. Tapping a tile selects it and closes the modal. */
    .prefab-cat {
      font-size: 11px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: 14px 0 6px 0;
    }
    .prefab-cat:first-child { margin-top: 6px; }
    .prefab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }
    .prefab-tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
      padding: 14px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      min-height: 88px;
    }
    .prefab-tile:hover, .prefab-tile:active { background: var(--panel-hover); border-color: var(--accent); }
    .prefab-tile .icon { font-size: 32px; line-height: 1; }
    .prefab-tile .label { font-size: 12px; color: var(--text); }
    /* Phase 5.4: custom-prefab tile gets a small × in the corner. The × is a separate hit
       area so tapping the tile body still places, only tapping the × deletes (with confirm). */
    .prefab-tile { position: relative; }
    .prefab-tile .x {
      position: absolute; top: 4px; right: 4px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,0.55); color: var(--text-dim);
      font-size: 14px; line-height: 22px; text-align: center;
      cursor: pointer;
    }
    .prefab-tile .x:hover { background: var(--danger); color: #2a0a0a; }
    /* Phase 5.2.2 (B5): color swatch row in the Style modal. Tiles are 44x44 (touch target),
       gap is 6px, and the active tile gets the accent border so the user can see what the
       current pick is. Custom-hex input sits beneath the swatches and accepts any HTML5
       <input type="color"> value (browsers handle the wheel UI). */
    .color-pick {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    .color-pick .opt {
      width: 44px; height: 44px;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
      position: relative;
    }
    .color-pick .opt.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4), 0 0 0 2px rgba(74, 222, 128, 0.35);
    }
    .color-pick .opt[data-default="1"]::after {
      content: ""; position: absolute; inset: 4px;
      border: 1px dashed rgba(255,255,255,0.5);
      border-radius: 4px;
      pointer-events: none;
    }
    .color-custom-row {
      display: flex; align-items: center; gap: 8px; margin-top: 12px;
    }
    .color-custom-row label { font-size: 12px; color: var(--text-dim); }
    .color-custom-row input[type="color"] {
      width: 44px; height: 44px; padding: 0;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
    }
    .color-custom-row input[type="text"] {
      flex: 1; padding: 10px; font-size: 14px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
    }

    /* Phase 5.4: emoji-picker row in the Save Template modal. */
    .emoji-pick {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    .emoji-pick .opt {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    .emoji-pick .opt.active, .emoji-pick .opt:hover {
      border-color: var(--accent);
      background: var(--panel-hover);
    }

    /* Phase 5.3: tag chips. Used inside the Tags modal for the "currently attached" pills and
       for the typeahead suggestion strip below the input. */
    #toolbar .tb-tags-count {
      font-size: 11px; color: var(--accent); font-weight: 600;
      margin-left: 2px;
    }
    .tags-chips {
      display: flex; flex-wrap: wrap; gap: 6px;
      min-height: 36px;
      padding: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 8px;
    }
    .tags-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px;
      font-size: 12px;
      background: var(--panel-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .tags-chip .x {
      cursor: pointer; color: var(--text-dim);
      width: 14px; height: 14px; line-height: 14px; text-align: center;
      border-radius: 50%;
    }
    .tags-chip .x:hover { background: var(--danger); color: var(--bg); }
    .tags-empty {
      color: var(--text-dim); font-size: 12px;
      padding: 6px 4px;
    }
    .tags-input-row {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .tags-input-row input { flex: 1; }
    .tags-input-row button {
      padding: 0 14px; font-size: 14px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer;
    }
    .tags-input-row button:hover { background: var(--panel-hover); border-color: var(--accent); }
    .tags-suggest {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 6px;
      max-height: 110px; overflow-y: auto;
    }
    .tags-suggest-chip {
      cursor: pointer; padding: 3px 8px; font-size: 11px;
      background: transparent; color: var(--text-dim);
      border: 1px dashed var(--border); border-radius: 999px;
    }
    .tags-suggest-chip:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="status">loading...</div>
  <div id="sunPhase" class="hidden"></div>
  <button id="askButton" title="Ask the master gardener">🌱 Ask</button>
  <button id="calendarButton" title="Generate a planting calendar">📅 Calendar</button>
  <button id="settingsButton" title="Garden settings (location)">⚙</button>
  <button id="unitChip" class="chip" title="Tap to cycle units (ft / in / cm)">ft</button>
  <button id="snapChip" class="chip" title="Tap to cycle snap-to-grid">Snap: off</button>
  <div id="compass" aria-hidden="true">
    <div class="needle"></div>
    <div class="needle tail"></div>
    <span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span>
  </div>
  <div id="nudges"></div>
  <div id="buttons">
    <button data-mode="bed">Bed</button>
    <button data-mode="plant">Plant</button>
    <button data-mode="prefab">Prefab</button>
    <button disabled title="coming soon">Structure</button>
    <button disabled title="coming soon">Label</button>
  </div>
  <div id="radial">
    <div class="item" data-action="photo">Photo</div>
    <div class="item" data-action="rename">Rename</div>
    <div class="item" data-action="move">Move</div>
    <div class="item" data-action="resize">Resize</div>
    <div class="item danger" data-action="delete">Delete</div>
  </div>
  <!-- Phase 5.2.1: slim floating toolbar — replaces the Phase 5.0 edit panel. Built once and
       hidden by default; selectEntity()/clearSelection() in app.js toggle .hidden and rebuild
       the inner labels/buttons against the current selection. -->
  <div id="toolbar" class="hidden">
    <span class="tb-icon"></span>
    <span class="tb-name" data-act="rename" title="Rename"></span>
    <span class="tb-pos" data-act="position" title="Edit position">(0, 0, 0) ft</span>
    <span class="tb-actions">
      <button data-act="photo" title="Photo">📷</button>
      <button data-act="diagnose" title="Diagnose">🔍</button>
      <button data-act="resize" title="Resize">📐</button>
      <button data-act="move" title="Move">🚚</button>
      <!-- Phase 5.2.2 (B5): per-instance material color. Opens a swatch + custom-hex modal;
           the chosen color is stored in entity.extensions.color and read by the prefab
           builder when it next renders the mesh. -->
      <button data-act="style" title="Style">🎨</button>
      <!-- Phase 5.3: tags. Shows the count when present, just the icon otherwise. -->
      <button data-act="tags" title="Tags">🏷<span class="tb-tags-count"></span></button>
      <button data-act="duplicate" title="Duplicate">📋</button>
      <!-- Phase 5.4: save as a reusable "My Prefab" template. Stamp this entity's shape +
           tags + cropRef into the picker. -->
      <button data-act="save-template" title="Save as template">💾</button>
      <button data-act="delete" class="danger" title="Delete">🗑</button>
    </span>
    <span class="tb-close" data-act="close" title="Close">×</span>
  </div>
  <input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none" />

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <!-- Phase 5.1: SunCalc is vendored locally (lib/suncalc.js) — no CDN, MIT-licensed. -->
  <script src="lib/suncalc.js"></script>
  <!-- Phase 5.2: prefab library — must load before app.js so window.OpenHarvestPrefabs is
       available when app.js wires up the picker + meshForEntity branch. -->
  <!-- Phase 5.2.2: cache-bust suffix bumps with each UX-polish revision so iPhone Safari
       (which aggressively caches JS) picks up the new build without a full app reset. Bump
       the number whenever app.js, prefabs.js, or this file changes. -->
  <script src="lib/prefabs.js?v=522"></script>
  <script src="app.js?v=522"></script>
</body>
</html>
